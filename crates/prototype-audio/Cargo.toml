[package]
name = "prototype-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Prototype (2009) audio path reconstruction: RADP catalog + PROVEN IMA ADPCM codec decode."

[lib]
name = "prototype_audio"
path = "src/lib.rs"

[dependencies]
prototype-common = { workspace = true }
prototype-p3d    = { workspace = true }
prototype-math   = { workspace = true }
# M18: real audio output.  Optional (feature `audio-cpal`) because the
# Linux backend links against libasound headers; the default build
# stays dependency-free.  Android uses the same cpal API over AAudio/
# Oboe; PC uses ALSA/WASAPI — the device edge below is host-agnostic.
cpal = { version = "0.18", optional = true, default-features = false }

[features]
audio-cpal = ["dep:cpal"]
