[package]
name = "prototype-android"
description = "Android platform layer for prototype-rs: loader-style asset-folder bootstrap, game-file discovery, NativeActivity entry point"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "prototype_android"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
prototype-common  = { workspace = true }
prototype-engine  = { workspace = true }
prototype-input   = { workspace = true }
prototype-math    = { workspace = true }
prototype-p3d     = { workspace = true }
prototype-rcf     = { workspace = true }
prototype-render  = { workspace = true }
prototype-stream  = { workspace = true }
prototype-video   = { workspace = true }
prototype-audio   = { workspace = true }
thiserror         = { workspace = true }
log               = "0.4"

# All-target optional deps for the shared winit App handler (`app.rs`,
# feature `winit-app`).  On desktop the x11/wayland backends apply; on
# Android the target table below OVERRIDES the same crate with the
# native-activity backend, so one feature drives both platforms.
winit             = { version = "0.30", optional = true, default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
pollster          = { version = "0.4", optional = true }

# Block 55 (NEXT-UP (a)): the boot movie's audio DEVICE edge.  Optional
# because cpal's Linux backend links libasound (source-built into
# ~/.local here) and its Android backend (Oboe/AAudio) needs the NDK at
# build-script time — the 9 android audit cells stay audio-free; the
# feature is host-audited and enables `prototype-audio/audio-cpal` so
# the ring + stream shapes come from ONE crate.
cpal              = { version = "0.18", optional = true, default-features = false }

# --- Android-only dependencies --------------------------------------------
# Target-gated so a plain `cargo check/test` on any desktop host never pulls
# them (they need the NDK to link).  They are only compiled when BOTH
#   (a) the target is Android  AND  (b) the `android-activity` feature is on.
[target.'cfg(target_os = "android")'.dependencies]
android-activity   = { version = "0.6", features = ["native-activity"], optional = true }
android_logger     = { version = "0.14" }
# Block 102: the storage grant flow + toasts (jni_ui).  Version MUST
# stay 0.22 — android-activity 0.6 is built against jni 0.22.x and the
# JNIEnv types must unify to one crate version.
jni                = "0.22"
winit              = { version = "0.30", optional = true, default-features = false, features = ["rwh_06", "android-native-activity"] }

[features]
default = []
# The shared winit ApplicationHandler (`app.rs`) — compiles on EVERY
# target and is what both the Android activity and the desktop
# `prototype-demo` bin run.  Pulls the real wgpu render edge.
winit-app = [
    "dep:winit",
    "dep:pollster",
    "prototype-render/render-wgpu",
]
# Block 55 (NEXT-UP (a)): the app-level audio DEVICE edge for the boot
# movie — a real CPAL output stream draining the player's shared ring
# (`MovieAudioEdge`, movie.rs).  Host-audited via
# `cargo test -p prototype-android --features audio-cpal` (+ winit-app
# for the full app compile); on ANDROID the cell is UNAUDITED here
# (cpal's oboe backend needs the NDK at build-script time — same reason
# the android-only deps are target-gated) and is expected to be enabled
# on the CI APK build once the workflow runs on the user's repo.
audio-cpal = [
    "dep:cpal",
    "prototype-audio/audio-cpal",
]
# Turns on the NativeActivity glue + the real wgpu render loop wiring.
# Requires the Android NDK (linker + sysroot), so CI builds it per-target;
# the sandbox only ever compiles default features.
android-activity = [
    "winit-app",
    "dep:android-activity",
]

[dev-dependencies]
# The runtime constructor parses a real Lua51File (frevents.lua).
prototype-lua = { workspace = true }

# cargo-apk packaging metadata (the GitHub Actions build-apk.yml job
# consumes this; without it `cargo apk build` aborts).  The activity name
# MUST be android.app.NativeActivity — the glue is android-activity's
# native-activity backend (block 9/19), which that class loads.
[package.metadata.android]
package_name = "com.nazatric.prototype_rs"
package_label = "prototype-rs"
apk_label = "Prototype Rust"

[package.metadata.android.sdk]
# 26 = Android 8.0 — cpal 0.18 links libaaudio (API 26+); see
# .cargo/config.toml for the full rationale.  target 34 = Android 14.
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Prototype Rust"

[package.metadata.android.application.activity]
name = "android.app.NativeActivity"

# Block 102: the loader needs to READ THE USER'S OWN game files on the
# shared storage.  Android 11+ (API 30+): all-files access — the app
# opens the settings page on first launch (jni_ui).  Android 8-10
# (API 26-29): the classic runtime dialog; the manifest cap keeps the
# (harmless but scary) media grant off Android 11+ prompt lists.
[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 29
