# Cross-compilation linkers for Android (used by CI and by anyone with an
# NDK installed).  API 24 = Android 7.0 = minSdkVersion of the manifest.
#
# This sandbox has no NDK, so these never run locally — they exist so that
# `cargo apk build` / `cargo build --target aarch64-linux-android` work on
# the GitHub Actions runner without further configuration.

[target.aarch64-linux-android]
linker = "aarch64-linux-android24-clang"

[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi24-clang"

[target.i686-linux-android]
linker = "i686-linux-android24-clang"

[target.x86_64-linux-android]
linker = "x86_64-linux-android24-clang"

# Dependencies stay optimised in dev builds: debug builds of reverse-mode
# decoders are unusably slow otherwise, while workspace code stays fast to
# compile at opt-level 0.
[profile.dev.package."*"]
opt-level = 2
