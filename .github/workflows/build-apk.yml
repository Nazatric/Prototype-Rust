# prototype-rs — APK pipeline (loader-style: the APK ships NO game assets).
#
# Runs on the user's GitHub fork; this sandbox cannot build APKs (no
# Android SDK/NDK), so the workflow is the APK factory.
#
# Pipeline:
#   1. test-linux      — full workspace test suite + host sanity checks.
#   2. build-apk       — arm64 (aarch64) DEBUG APK, signed + zipaligned,
#                        with the first-launch all-files-access UI.
#   3. build-universal — placeholder (disabled).

name: build-apk

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Needed so the arm64 job can attach the installable APK to a release
# (a plain Actions artifact download is login-gated; a release asset is not).
permissions:
  contents: write
  actions: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test-linux:
    name: Test workspace (Linux host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # cpal's Linux backend links libasound — ubuntu-latest has no alsa.pc
      # by default, so alsa-sys' build script panics without these headers.
      - name: Install ALSA dev headers (audio-cpal feature)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      - name: Workspace test suite
        run: cargo test --workspace --locked

      # Block 57/58: the audio device + content edges.  CI runners have
      # no sound device — the e2e device tests SKIP by design there;
      # the unit tests + the cfg path still gate the feature compile.
      - name: Audio device/content edge suite (feature gate, device tests skip device-less)
        run: cargo test -p prototype-android --features audio-cpal --locked

      # `check` (not `test`): the desktop winit backends would need X11
      # dev libs at LINK time on the runner; a compile is enough for the
      # shared App + setup-screen code.
      - name: First-launch UI + shared App compile on the host
        run: cargo check -p prototype-android --features winit-app --locked

      - name: Android crate compiles on the host (default features)
        run: cargo check -p prototype-android --locked

      - name: wgpu render loop compiles (feature gate, no GPU needed to check)
        run: cargo check -p prototype-render --features render-wgpu --locked

      - name: Desktop demo bin compiles (feature gate, no display needed)
        run: cargo check -p prototype-demo --features render-wgpu --locked

      # The FULL glue (winit event loop + wgpu pipelines + NativeActivity
      # entry + JNI permission gate) compiles for the real Android target
      # WITHOUT an NDK — `check` never links.
      - name: Android glue compiles for aarch64 (feature on, no NDK needed to check)
        run: |
          rustup target add aarch64-linux-android
          cargo check -p prototype-android --features android-activity --target aarch64-linux-android --locked

  build-apk:
    name: APK (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: test-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android      # arm64 / aarch64 phones (the original request)
            abi: arm64-v8a
            out: prototype-rs-permission-ui-arm64-debug.apk
          - target: armv7-linux-androideabi    # 32-bit ARM phones (arm7)
            abi: armeabi-v7a
            out: prototype-rs-permission-ui-armv7-debug.apk
          - target: x86_64-linux-android       # x86_64 Android / emulators
            abi: x86_64
            out: prototype-rs-permission-ui-x86_64-debug.apk
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Set up JDK 17 (apk signing tooling)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK + NDK
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install \
            "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install cargo-apk
        run: cargo install --locked cargo-apk

      - name: Build debug APK
        run: |
          # ANDROID_HOME is a RUNNER image env var — it is NOT visible to
          # the ${{ env.* }} context, so the NDK root is exported here.
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.0.12077973"
          # audio-cpal is deliberately OFF for the APK: cpal's Oboe/AAudio
          # backend opens a real audio device during boot and was a prime
          # suspect for the "closes immediately" report.  The engine's
          # audio CONTENT edges still compile/run; only the device stream
          # is omitted from this debug build.
          cargo apk build -p prototype-android \
            --features android-activity \
            --target ${{ matrix.target }}

      - name: Locate APK
        id: apk
        run: |
          # cargo-apk writes an UNSIGNED *-unaligned.apk intermediate next
          # to the final zipaligned + debug-signed .apk.  `find | head -n1`
          # used to pick the intermediate, which Android rejects as an
          # invalid package.  Exclude it and verify the signature.
          APK=$(find target -type f -name '*.apk' ! -name '*-unaligned.apk' -print -quit)
          if [ -z "$APK" ]; then echo "no signed APK produced" >&2; exit 1; fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)
          if [ -n "$APKSIGNER" ]; then "$APKSIGNER" verify --verbose "$APK"; fi
          echo "Selected APK: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Verify this really is a ${{ matrix.abi }} / all-files-access build
        run: |
          python3 - <<'PY'
          import os, zipfile
          apk = os.environ["APK_PATH"]
          abi = os.environ["EXPECTED_ABI"]
          with zipfile.ZipFile(apk) as z:
              names = z.namelist()
              prefix = "lib/" + abi + "/"
              libs = [n for n in names if n.startswith("lib/")]
              assert any(n.startswith(prefix) for n in names), \
                  "not a " + abi + " APK: " + repr(libs)
              manifest = z.read("AndroidManifest.xml")
              utf16 = "MANAGE_EXTERNAL_STORAGE".encode("utf-16-le")
              assert (b"MANAGE_EXTERNAL_STORAGE" in manifest
                      or utf16 in manifest), \
                  "MANAGE_EXTERNAL_STORAGE is missing from the generated manifest"
              # NOTE: do NOT grep the raw AXML bytes for
              # "sensorLandscape": aapt compiles enum attributes into an
              # integer constant, so the literal string is absent even
              # when the attribute is present.  The aapt dump below is
              # the authoritative check.
          print("OK: " + abi + " native lib + MANAGE_EXTERNAL_STORAGE declared")
          PY
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
          EXPECTED_ABI: ${{ matrix.abi }}

      - name: Verify the compiled manifest locks orientation to landscape
        run: |
          # `aapt dump xmltree` decodes binary AXML back to readable
          # attributes, including enum-valued ones.  Never fatal: the
          # runtime setRequestedOrientation(6) call is the backstop.
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print -quit)
          if [ -n "$AAPT" ]; then
            "$AAPT" dump xmltree "${{ steps.apk.outputs.path }}" AndroidManifest.xml \
              | tee /tmp/xmltree.txt | grep -i -E 'screenOrientation|configChanges' || true
            if grep -q 'screenOrientation' /tmp/xmltree.txt; then
              echo "OK: android:screenOrientation present in compiled manifest"
            else
              echo "WARN: no screenOrientation attribute; runtime JNI lock is the fallback"
            fi
          fi

      # Also expose the APK on the RUN page.  This repo's Actions
      # artifact quota was exhausted earlier, so it is explicitly
      # non-fatal: the release asset below is always the real
      # deliverable and is never blocked by artifact storage.
      - name: Upload APK as a run artifact (best effort)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish ${{ matrix.abi }} APK as a direct-download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=ci-apks
          OUT="${{ matrix.out }}"
          cp "${{ steps.apk.outputs.path }}" "$OUT"
          # Three matrix jobs run in parallel; make release creation
          # idempotent instead of racing a single create.
          for i in 1 2 3 4 5 6; do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            gh release create "$TAG" \
              --title "Prototype Rust debug APKs (CI)" \
              --notes "Installable, zipaligned, debug-signed per-ABI APKs built by the build-apk workflow: arm64-v8a (aarch64), armeabi-v7a (arm7), x86_64. Requires Android 11 (API 30) or newer." 2>/dev/null || true
            sleep 3
          done
          gh release upload "$TAG" "$OUT" --clobber
          echo "Direct download: https://github.com/${{ github.repository }}/releases/download/$TAG/$OUT"

      # NOTE: an installable stripped arm64 APK is ALSO checked into
      # `apk/` on this branch so it is visible/downloadable from the
      # workspace file tree (private-repo release assets otherwise need a
      # GitHub browser session).  That commit was made once by CI; this
      # workflow does not push to the branch on every run, because a bot
      # push creates an approval-required follow-up workflow run.

  # One-shot helper, run with:
  #   gh workflow run 410139473 --ref arena/8d27a532-prototype-rust
  # Private-repo release assets need a GitHub login, and this sandbox cannot
  # reach release-assets.githubusercontent.com.  This job copies all three
  # ABI APKs into `apk/` so they are downloadable straight from the branch.
  publish-apks-to-branch:
    name: Copy all three APKs into apk/
    if: github.event_name == 'workflow_dispatch'
    needs: build-apk
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ci-apks
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download the three release assets
        run: |
          set -euo pipefail
          mkdir -p /tmp/assets apk
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern 'prototype-rs-permission-ui-*.apk' \
            --dir /tmp/assets --clobber
          ls -lh /tmp/assets
          cp /tmp/assets/prototype-rs-permission-ui-arm64-debug.apk  apk/prototype-rs-arm64-debug.apk
          cp /tmp/assets/prototype-rs-permission-ui-armv7-debug.apk  apk/prototype-rs-armv7-debug.apk
          cp /tmp/assets/prototype-rs-permission-ui-x86_64-debug.apk apk/prototype-rs-x86_64-debug.apk

      - name: Verify each APK is signed and contains the right native ABI
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, zipfile
          expected = {
              "apk/prototype-rs-arm64-debug.apk":   "arm64-v8a",
              "apk/prototype-rs-armv7-debug.apk":   "armeabi-v7a",
              "apk/prototype-rs-x86_64-debug.apk":  "x86_64",
          }
          for path, abi in expected.items():
              size = os.path.getsize(path)
              assert size > 5_000_000, (path, "suspiciously small", size)
              with zipfile.ZipFile(path) as z:
                  names = z.namelist()
                  libs = [n for n in names if n.startswith("lib/%s/" % abi) and n.endswith(".so")]
                  assert libs, (path, "missing lib/%s/" % abi, names[:20])
                  sigs = [n for n in names if n.startswith("META-INF/") and n.endswith((".RSA", ".SF", ".MF"))]
                  assert len(sigs) >= 3, (path, "not signed", sigs)
                  assert "AndroidManifest.xml" in names
              print("OK %-42s %10d bytes  lib/%s/" % (path, size, abi))
          PY

      - name: Commit and push only when the APKs changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk/*.apk
          if git diff --cached --quiet; then
            echo "APKs are already up to date in the branch; nothing to push."
            exit 0
          fi
          git commit -m "CI: add installable arm64, armv7 and x86_64 APKs [skip ci]"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "Published:"
          git ls-tree -r --long HEAD -- apk/

  build-universal-apk:
    name: Universal APK (placeholder)
    runs-on: ubuntu-latest
    needs: build-apk
    if: false
    steps:
      - uses: actions/checkout@v4
      - name: Not yet implemented
        run: echo "Enable after per-ABI builds are green."
